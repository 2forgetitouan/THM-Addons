name: All tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Install graphics test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools xvfb xauth libgl1-mesa-dri libglx-mesa0

      - name: Build and run tests
        run: xvfb-run -a ./gradlew --no-daemon clean build --console=plain

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: thm-addons-builds
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/client-startup/
          if-no-files-found: ignore
          retention-days: 14
